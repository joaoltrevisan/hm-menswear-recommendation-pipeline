name: hm-menswear-local
services:
  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    # Row-level diagnostics belong in sanitized application reason codes.
    command:
      - postgres
      - -c
      - log_min_messages=panic
      - -c
      - log_min_error_statement=panic
      - -c
      - log_statement=none
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - log_transaction_sample_rate=0
      - -c
      - log_duration=off
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
    environment:
      POSTGRES_USER: hm_bootstrap
      POSTGRES_DB: hm_menswear
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${HM_PG_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hm_bootstrap -d hm_menswear"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
secrets:
  postgres_password:
    file: ${HM_PG_PASSWORD_FILE:?Set HM_PG_PASSWORD_FILE to a private password file}
volumes:
  postgres_data:
