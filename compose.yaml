name: hm-menswear-local
services:
  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: hm_bootstrap
      POSTGRES_DB: hm_menswear
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${HM_PG_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hm_bootstrap -d hm_menswear"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
secrets:
  postgres_password:
    file: ${HM_PG_PASSWORD_FILE:?Set HM_PG_PASSWORD_FILE to a private password file}
volumes:
  postgres_data:
